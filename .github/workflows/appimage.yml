# Compila el launcher para Linux (AppImage) y Windows (.zip) en GitHub Actions.
# Se ejecuta en cada cambio; con una etiqueta vX.Y.Z publica una Release con los dos paquetes.
name: Compilar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Una base antigua hace que el AppImage funcione en más distribuciones.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-12 g++-12 cmake ninja-build git curl file \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev

      - name: Compilar (SDL2, SwanStation y launcher)
        env:
          CC: gcc-12
          CXX: g++-12
        run: ./build.sh

      - name: Empaquetar AppImage
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="${GITHUB_REF_NAME}"; else VERSION="${GITHUB_SHA::7}"; fi
          packaging/make_appimage.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: KageNoMon-AppImage
          path: KageNoMon-*-x86_64.AppImage

  windows:
    # Compilación cruzada con llvm-mingw (versión fija, descargada y comprobada por build-windows.sh).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build git curl xz-utils

      - name: Compilar y empaquetar
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="${GITHUB_REF_NAME}"; else VERSION="${GITHUB_SHA::7}"; fi
          ./build-windows.sh --package "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: KageNoMon-Windows
          path: KageNoMon-*-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KageNoMon-*-x86_64.AppImage
            KageNoMon-*-windows-x64.zip
          body: |
            **Linux:** AppImage para x86_64. **Windows 10/11:** descomprime el .zip y abre KageNoMon.exe.
            No incluye el juego: copia la imagen de tu disco en la carpeta `game/`. La BIOS es opcional
            (viene OpenBIOS integrada).
